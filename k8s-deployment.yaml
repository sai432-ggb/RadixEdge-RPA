apiVersion: v1
kind: Namespace
metadata:
  name: radixedge-rpa

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: radixedge-rpa
  namespace: radixedge-rpa
  labels:
    app: radixedge-rpa
    version: v1.0.0
spec:
  replicas: 3
  selector:
    matchLabels:
      app: radixedge-rpa
  template:
    metadata:
      labels:
        app: radixedge-rpa
        version: v1.0.0
    spec:
      containers:
      - name: radixedge-rpa
        image: radixedge-rpa:latest
        ports:
        - containerPort: 3000
          name: http
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "3000"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: radixedge-rpa-service
  namespace: radixedge-rpa
  labels:
    app: radixedge-rpa
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 3000
    protocol: TCP
    name: http
  selector:
    app: radixedge-rpa

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: radixedge-rpa-hpa
  namespace: radixedge-rpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: radixedge-rpa
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
